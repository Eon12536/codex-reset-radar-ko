<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>Codex Reset Radar</title>
    <style>
      * { box-sizing: border-box; }
      html, body { width: 440px; height: 280px; margin: 0; overflow: hidden; }
      body {
        display: grid;
        place-items: center;
        color: #f1f4f3;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        background: radial-gradient(circle at 80% 5%, rgba(231,169,59,.22), transparent 38%), radial-gradient(circle at 10% 90%, rgba(95,185,173,.13), transparent 35%), #081011;
      }
      main { width: 410px; height: 250px; padding: 36px 36px; display: flex; align-items: center; gap: 25px; border: 1px solid #293534; border-radius: 18px; }
      .radar { position: relative; width: 104px; height: 104px; flex: 0 0 104px; border: 3px solid #e7a93b; border-radius: 50%; box-shadow: 0 0 30px rgba(231,169,59,.12); }
      .radar::before, .radar::after { content:""; position:absolute; border:1px solid rgba(231,169,59,.45); border-radius:50%; }
      .radar::before { inset: 21px; }
      .radar::after { inset: 43px; background:#ffd475; box-shadow:0 0 12px #e7a93b; }
      .sweep { position:absolute; inset:7px; border-radius:50%; background:conic-gradient(from 260deg, transparent 0 70%, rgba(231,169,59,.65) 86%, transparent 91%); }
      h1 { margin: 0; font-size: 29px; line-height: 1.04; letter-spacing: -.03em; }
      p { margin: 12px 0 0; color: #83d6ca; font-size: 12px; font-weight: 650; letter-spacing: .05em; text-transform: uppercase; }
    </style>
  </head>
  <body><main><div class="radar"><span class="sweep"></span></div><div><h1>Codex<br>Reset Radar</h1><p>Signals · Quota · Credits</p></div></main></body>
</html>
